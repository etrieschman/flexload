[project]
name = "flexload"
version = "0.0.1"
description = "Tariff design for price-responsive loads in wholesale electricity markets: a two-player game on RTS-GMLC."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Erich Trieschman" }]
dependencies = [
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "gurobipy>=12",
    "highspy>=1.8",
    "numpy>=2",
    "polars>=1.30",
    "rts-gmlc",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
    "matplotlib>=3.9",
]

[tool.uv.sources]
rts-gmlc = { git = "https://github.com/etrieschman/rts-gmlc" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flexload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
