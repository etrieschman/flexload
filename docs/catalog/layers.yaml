- id: emergency_response_service__ercot
  layer: emergency_response_service
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_derived: true
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per service time period
      definition: >
        The entity's adjusted metered load over one of the service time periods
        that make up a contract period. Numerator of the share for that period.
    - symbol: 't'
      unit: —
      definition: >
        A service time period - one of the recurring blocks of hours a contract
        covers, not the whole contract term.
  base_note: >
    The protocol states the share rather than the determinant, defining it as
    the entity's total load in the time period over total ERCOT load in the
    same period. The numerator is written here in the truncated form used
    everywhere else in the protocols so the record is comparable with the other
    load-ratio layers, which is a reconstruction rather than quoted text.
  measurement_window: >
    Each service time period within the contract period, separately.
  billing_window: >
    The contract period, settled once and then resettled.
  determinacy: contemporaneous
  pool: >
    Payments to demand-side resources contracted to curtail when the grid is
    short. A voluntary programme procured in advance for a fixed term.
  rate: '\Phi^{k}_{e} \;=\; \sum_{t \in \mathcal{P}} C^{k}_{t}\, \mathrm{LRS}_{e,t} \qquad\qquad \mathrm{LRS}_{e,t} \;=\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}}'
  rate_type: average_cost
  rate_derived: true
  rate_definitions:
    - symbol: '\Phi^{k}_{e}'
      unit: $
      definition: The entity's emergency response service charge for the contract period.
    - symbol: 'C^{k}_{t}'
      unit: $
      definition: The pool for one service time period.
  exact_recovery: "yes"
  true_up: >
    Yes. Settled first on the latest available settlement load, then resettled
    using trued-up load for every operating day in the contract period.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
    section: 6.6.11.2, Emergency Response Service Capacity Charge, para (1)
    effective_date: 2026-08-01
    quote: >
      ERCOT shall allocate costs for an ERS service type and ERS Contract
      Period based on the LRS of each QSE during each ERS Time Period in an ERS
      Contract Period. A QSE's LRS for an ERS Time Period shall be the QSE's
      total Load for the ERS Time Period divided by the total ERCOT Load in the
      ERS Time Period.
    url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
  notes: >
    ERCOT pays some loads to be available to curtail, and charges all loads for
    it, so a load enrolled in the programme sits on both sides.
    The allocation is narrower than most layers here. Rather than one
    system-wide share, the cost of each service type is spread only across the
    time periods that service actually covers, so a load consuming heavily
    during the covered hours pays more of it. That ties the charge to the hours
    the service is bought for more closely than any other pooled layer in this
    inventory.

