- id: uplift__ercot
  layer: uplift
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per 15-min interval
      definition: >
        The load's adjusted metered withdrawal for the interval, truncated at
        zero in each of its zones. Numerator of the load ratio share.
  base_note: >
    The determinant has nothing to do with why the cost arose. This layer only
    exists to collect what the shortfall-based charge could not, and it does so
    on ordinary consumption.
  measurement_window: >
    The 15-minute Settlement Interval being billed.
  billing_window: >
    The same 15-minute Settlement Interval.
  determinacy: contemporaneous
  pool: >
    Make-whole payments to units committed by ERCOT for reliability, including
    reliability-must-run units, less whatever was already recovered from
    capacity-short QSEs.
  rate: '\Phi^{k}_{e,t} \;=\; \left(\frac{C^{k,\mathrm{tot}}_{t}}{4} \;-\; C^{k,\mathrm{short}}_{t}\right) \mathrm{LRS}_{e,t} \qquad\qquad \mathrm{LRS}_{e,t} \;=\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}}'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: The load's share of the uncovered make-whole cost for the interval.
    - symbol: 'C^{k,\mathrm{tot}}_{t}'
      unit: $ per hour
      definition: >
        Total make-whole payments for all reliability commitment processes in
        the hour containing this interval. The division by four in the formula
        is what brings it down to the interval.
    - symbol: 'C^{k,\mathrm{short}}_{t}'
      unit: $
      definition: >
        What was already collected from capacity-short QSEs in the interval -
        see the RUC Capacity Short record.
  exact_recovery: "yes"
  true_up: >
    None needed. This layer is itself the true-up - it exists to close whatever
    gap the capacity-short charge leaves.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 5 - Transmission Security Analysis and Reliability Unit Commitment
    section: 5.7.4.2, RUC Make-Whole Uplift Charge, para (1)
    effective_date: 2026-08-01
    quote: >
      If the revenues from the charges under Section 5.7.4.1, RUC
      Capacity-Short Charge, are not enough to cover all RUC Make-Whole
      Payments, including amounts for RMR Units, for a 15-minute Settlement
      Interval, then the difference will be uplifted to all QSEs on a Load
      Ratio Share basis.
    url: https://www.ercot.com/files/docs/2024/06/28/05-080126_Nodal.docx
  notes: >
    The second tier of a two-tier mechanism. ERCOT first tries to charge the
    QSEs that were short of capacity, then spreads whatever is left over all
    load by consumption.
    The two tiers point in opposite directions. The first is targeted and
    avoidable - a QSE can escape it by arranging capacity. The second is
    untargeted and can only be avoided by consuming less, at a moment when
    consumption had nothing to do with the cost. How much of the pool ends up
    in each tier depends on the cap in the first tier, so an administrative
    parameter decides how much of the cost is targeted and how much socialised.

- id: capacity_obligation__ercot
  layer: capacity_obligation
  market: ercot
  status: absent
  payer: qse
  base: null
  base_type: null
  base_note: null
  measurement_window: null
  billing_window: null
  determinacy: contemporaneous
  pool: null
  rate: null
  rate_type: null
  exact_recovery: "n/a"
  true_up: none
  redirect: null
  source:
    document: 16 Tex. Admin. Code §25.501, Wholesale Market Design for the Electric Reliability Council of Texas (PUCT Substantive Rules)
    section: (b), Bilateral markets and default provision of energy and ancillary capacity services
    effective_date: 2012-04-18
    quote: >
      ERCOT shall permit market participants to self-arrange (self-schedule or
      bilaterally contract for) energy and ancillary capacity services, except
      to the extent that doing so would adversely impact ERCOT's ability to
      maintain reliability. To the extent that a market participant does not
      self-arrange the energy and ancillary capacity services necessary to meet
      its obligations [...] ERCOT shall procure energy and ancillary capacity
      services on behalf of the market participant to cover the shortfall and
      charge the market participant for the services provided.
    url: https://ftp.puc.texas.gov/public/puct-info/agency/rulesnlaws/subrules/electric/25.501/25.501.pdf
  notes: >
    ERCOT has no capacity market and places no capacity obligation on load, so
    there is nothing to charge and no determinant to record. Price stands in its
    place: resource adequacy is meant to come from energy and reserve prices
    rising high enough in tight conditions to attract investment. The market
    design rule lists what ERCOT procures - energy and ancillary services - and
    no capacity product appears in it. The companion resource adequacy rule
    requires only a five-year adequacy forecast and creates no obligation on
    anyone.

- id: transmission_network_service__ercot
  layer: transmission_network_service
  market: ercot
  status: present
  payer: dsp
  base: 'x^{k}_{e,y} \;=\; \frac{1}{4}\sum_{m \,\in\, \mathcal{M}} d_{e,\;t_{m}(y-1)} \qquad\qquad t_{m}(y-1) \;=\; \arg\max_{\,t \,\in\, \mathcal{T}_{m,y-1}} \; \sum_{e^{\prime} \in \mathcal{E}} d_{e^{\prime},t}'
  base_type: coincident_peak
  base_definitions:
    - symbol: 'x^{k}_{e,y}'
      unit: MW, averaged over 4 intervals
      definition: >
        The entity's average demand across the four peak intervals. A demand
        level, not energy - which is why the measurement window alone does not
        tell you the unit. One number per year; it does not vary by month.
    - symbol: 'd_{e,t}'
      unit: MW
      definition: >
        Demand of entity e during interval t. Load served by wholesale storage
        is excluded from the count.
    - symbol: 't_{m}(y-1)'
      unit: —
      definition: >
        The interval in month m at which total ERCOT demand was highest. Set by
        everyone else's aggregate demand, not by yours, and only identifiable
        after the month has passed.
    - symbol: 'y'
      unit: —
      definition: >
        The billing year. The four intervals occur during the summer of year
        y-1, are filed by ERCOT that December, and then bill throughout year y.
  base_note: >
    The rule does not say how long these intervals are; it defers that to
    ERCOT's own protocols. Not recorded here because it was not read from
    protocol text.
  measurement_window: >
    Measured across four intervals - the peak of total ERCOT demand in each of
    June, July, August and September. Those intervals happen, and are
    identified, during that summer itself. ERCOT files the resulting figures by
    1 December, and they then bill in every one of the twelve months of the
    following calendar year, unchanged. A single summer's behaviour is frozen
    into a full year of charges paid afterwards.
  billing_window: >
    Every month of the following calendar year - twelve charges from one summer's measurements.
  determinacy: retrospective
  pool: >
    The transmission owner's approved cost of service - its transmission
    operating expenses, plus depreciation and other costs assigned to the
    transmission function.
  rate: '\Phi^{k}_{e,y} \;=\; r_{y}\, x^{k}_{e,y} \qquad\qquad r_{y} \;=\; \frac{C^{k}}{X^{k}_{y}} \qquad\qquad X^{k}_{y} \;=\; \frac{1}{4}\sum_{m \,\in\, \mathcal{M}}\;\sum_{e^{\prime} \in \mathcal{E}} d_{e^{\prime},\;t_{m}(y-1)}'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,y}'
      unit: $
      definition: The entity's transmission charge for the year. Billed in twelve monthly instalments.
    - symbol: 'C^{k}'
      unit: $ per year
      definition: >
        The transmission owner's approved cost of service - the pool being
        recovered. Fixed at the last rate case and not refreshed alongside the
        billing determinants, which is why recovery is not exact.
    - symbol: 'd_{e,t}'
      unit: MW
      definition: >
        Demand of entity e during interval t - the same quantity the base
        measures, reused here to build the denominator.
    - symbol: 'X^{k}_{y}'
      unit: MW
      definition: >
        Total demand across all billed entities over the same four peak
        intervals, divided by four. Turns the pool into a per-MW rate.
    - symbol: 'r_{y}'
      unit: $/MW per year
      definition: >
        The resulting annual rate. The rule directs that it be converted to a
        monthly figure and billed in twelve instalments but does not specify
        the divisor, so only the annual form is recorded.
  exact_recovery: "no"
  true_up: >
    None within a year, and none on billing-unit variance at all. The rate stays
    in force until a new one is approved, so any shortfall or surplus is settled
    in the next rate case rather than trued up as it accrues.
  redirect: null
  source:
    - document: 16 Tex. Admin. Code §25.192, Transmission Service Rates (PUCT Substantive Rules)
      section: (b)(1) rate and charge; (d) billing units
      effective_date: 2022-12-20
      quote: >
        A TSP's transmission rate shall be calculated as its commission-approved
        transmission cost of service divided by the average of ERCOT coincident
        peak demand for the months of June, July, August and September (4CP),
        excluding the portion of coincident peak demand attributable to
        wholesale storage load. [...] The monthly transmission service charge
        to be paid by
        each DSP is the product of each TSP's monthly rate as specified in its
        tariff and the DSP's previous year's average of the 4CP demand that is
        coincident with the ERCOT 4CP. [...] A TSP's transmission rate shall
        remain in effect until the commission approves a new rate. The TSP's
        annual rate shall be converted to a monthly rate. [...] No later than
        December 1 of each year, ERCOT shall determine and file with the
        commission the current year's average 4CP demand for each DSP [...]
        This demand shall be used to bill transmission service for the next
        year.
      url: https://ftp.puc.texas.gov/public/puct-info/agency/rulesnlaws/subrules/electric/25.192/25.192.pdf
    - document: ERCOT Nodal Protocols, Section 9 - Settlement and Billing
      section: 9.17, Transmission Billing Determinant Calculation, para (1)
      effective_date: 2026-08-01
      quote: >
        ERCOT shall provide Market Participants with the key parameters and
        formula components required by a Transmission Service Provider (TSP) or
        Distribution Service Provider (DSP) in determining the billing charges
        for the use of its Transmission Facilities or Distribution Facilities
        ("Transmission Billing Determinants"). ERCOT is not responsible for
        billing, collection, or disbursal of payments associated with
        transmission access service.
      url: https://www.ercot.com/files/docs/2023/06/01/09-080126_Nodal.docx
  notes: >
    A year of transmission charges turns on demand during four intervals, and
    those intervals are only identifiable after the fact. This is the sharpest
    incentive in the inventory: avoiding load during four moments out of roughly
    thirty-five thousand determines an entire year's bill.
    The timing runs forward, not backward. The peaks are set during the summer
    as it happens; ERCOT files the figures by 1 December; the charges are then
    paid across the following twelve months. Nothing is chosen retrospectively -
    the determinant is fixed by behaviour in real time and then billed later.
    This makes the layer unusual in one respect: the load acts long before it
    can know whether the action mattered, because whether a given interval turns
    out to be the monthly peak depends on the whole system's demand.
    At the time of this extraction - August 2026 - the June and July 2026 peaks
    have already occurred and are locked in, and the August and September ones
    have not. Consumption in the coming weeks is setting transmission charges
    payable throughout 2027.
    The mechanism is not in an ERCOT tariff. It sits in a state regulator's
    rule, and ERCOT's protocols disclaim responsibility for billing, collecting
    or disbursing transmission payments - ERCOT only calculates and files the
    underlying quantities.
    Recovery is not exact. The rate stays in force until the commission
    approves a new one, so its denominator is frozen at the peak demand assumed
    in the last rate case, while the billing determinant is refreshed every year
    from the most recent summer. Collections are the cost of service scaled by
    the ratio of realised peak demand to the assumed figure, so in a market
    adding load the layer over-recovers, and the faster load grows the more it
    over-recovers. Nothing in the rule reconciles the difference as it accrues;
    it is picked up whenever the next rate case happens.
    Two caveats. The charge falls on distribution utilities rather than on
    individual loads, so how it reaches any particular load is a retail
    question. And a pending rulemaking proposes replacing four peak intervals
    with twelve; as of this extraction the rule still says four and the
    proceeding is undecided.

- id: interconnection_upgrade_assignment__ercot
  layer: interconnection_upgrade_assignment
  market: ercot
