  measurement_window: TODO
  billing_window: null
  determinacy: contemporaneous
  pool: TODO
  rate: TODO
  rate_type: TODO
  exact_recovery: TODO
  true_up: TODO
  redirect: null
  source: {document: TODO, section: TODO, effective_date: TODO, quote: TODO, url: TODO}
  notes: >
    Deliberately left unfilled. This is the layer closest to the large-load
    question and the only one in the inventory with no settled rule to cite.
    A new state rule, 16 TAC §25.194, would set interconnection standards for
    loads of 75 MW and above in ERCOT, implementing legislation passed in June
    2025. It was proposed in March 2026 and, as of this extraction in August
    2026, has not been adopted - there is no rule text at the location where
    every other adopted rule in this chapter is published. Reported figures for
    interconnection fees and financial security come from the proposal, not
    from an operative rule, so recording them would breach the sourcing
    standard.
    A second and more consequential proposal is further along. Under PUCT
    Project No. 58000, published for comment in July 2026 with comments due 11
    August 2026, a proposed new rule §25.252 would set tariff terms for large
    load customers. As proposed it would replace the four summer peaks with
    twelve monthly ones measured over 30-minute intervals, and - the part that
    matters here - set a minimum billing demand equal to the greatest of the
    customer's contracted peak, its highest non-coincident demand in the prior
    year, and its measured coincident-peak demand, payable monthly for 240
    consecutive months and starting when reserved capacity becomes available
    whether or not the facility is drawing power.
    If adopted in that form it would be the first ERCOT layer whose determinant
    is contracted capacity rather than metered consumption, and the only one a
    load cannot reduce by changing behaviour at all. It is the single most
    relevant pending item in Texas for a flexible-load argument. It is not
    recorded as a layer because it is a proposal, not an operative rule.

- id: regional_project_cost_allocation__ercot
  layer: regional_project_cost_allocation
  market: ercot
  status: absorbed
  payer: dsp
  base: null
  base_type: null
  base_note: null
  measurement_window: null
  billing_window: null
  determinacy: contemporaneous
  pool: null
  rate: null
  rate_type: null
  exact_recovery: "n/a"
  true_up: none
  redirect: transmission_network_service__ercot
  source:
    document: 16 Tex. Admin. Code §25.192, Transmission Service Rates (PUCT Substantive Rules)
    section: (c), Transmission cost of service
    effective_date: 2022-12-20
    quote: >
      The transmission cost of service for each TSP shall be based on the
      expenses in Federal Energy Regulatory Commission (FERC) expense accounts
      560-573 (or accounts with similar contents or amounts functionalized to
      the transmission function) plus the depreciation [...]
    url: https://ftp.puc.texas.gov/public/puct-info/agency/rulesnlaws/subrules/electric/25.192/25.192.pdf
  notes: >
    ERCOT sits outside federal jurisdiction, so it has no separate regional
    cost allocation process and no beneficiary-pays test for new transmission.
    A project's costs enter the building utility's cost of service and are
    recovered through the ordinary peak demand charge alongside everything else
    that utility owns.
    The effect is that new transmission is paid for on the same four peak
    intervals as existing transmission, regardless of who the project was built
    for or who benefits from it. There is no determinant that distinguishes a
    load driving new construction from one that is not.

- id: rmr__ercot
