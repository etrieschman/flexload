# Cost-allocation layer inventory.
#
# Every `TODO` is still to be filled from source text. Nothing here is asserted
# without a citation and a verbatim quote.
#
# Records are unique on (layer, market). Every layer exists as a record in
# every market, even where the market has no such charge - `status` then reads
# `absent` or `absorbed`, and an absorbed layer points at the record that
# swallowed it via `redirect`.
#
# THE UNIT. ERCOT settles with the Qualified Scheduling Entity, written e
# throughout. Every protocol formula here indexes by that entity, and every
# determinant is computed across its whole portfolio - so a truncation at zero,
# or a load ratio share, applies to the portfolio and not to an individual load
# inside it. The one exception is transmission, which a state rule bills to the
# Distribution Service Provider instead; `payer` records which applies. How a
# charge then reaches an individual load is a retail question this inventory
# excludes. Index letters are listed under `notation` in schema.yaml.
#
# COVERAGE. The layer list is reconciled against Section 9.5.3, which
# enumerates every real-time settlement charge type. Charge types falling on
# generators rather than load - resource set point deviation charges, RUC
# clawback, high dispatch limit overrides, congestion right settlements - are
# out of scope by design. Load-allocated charge types not yet given a record:
# 6.6.9.2 emergency operations, 6.6.3.10 constraint management plan cost
# recovery, 6.7.2.8 derated ancillary service capability, 6.6.6.12 must-run
# alternative service, and 9.18 profile development cost recovery.
#
# Ancillary services are one layer, not several. In ERCOT the five live
# products (Reg-Up, Reg-Down, RRS, Non-Spin, ECRS) are allocated by an
# identical formula differing only in the product acronym. A sixth, DRRS, is
# drafted into the protocols behind a pending implementation flag (NPRR1309)
# and is not yet charged.
#
# Symbols shared across records - Adjusted Metered Load, the Load Ratio Share,
# the truncation at zero, and the index letters - are declared once under
# `notation` in schema.yaml and rendered as a glossary on the page. Records
# define only what is specific to them.

records:

- id: energy_congestion__ercot
  layer: energy_congestion
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,z,t} \;=\; \sum_{n \,\in\, \mathcal{N}_{e,z}} \mathrm{AML}_{e,n,t}'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,z,t}'
      unit: MWh per 15-min interval
      definition: >
        The entity's own adjusted metered withdrawal inside one Load Zone,
        accumulated over one settlement interval. Zone-level because the price
        is set per zone - an entity holding load in several zones has one of
        these for each, and the charge sums over the zones it serves.
    - symbol: '\mathcal{N}_{e,z}'
      unit: —
      definition: >
        The nodes inside Load Zone z at which this entity actually serves load -
        not every node in the zone. Contrast the price below, which is averaged
        over N_z, every node in the zone, regardless of who serves load there.
  base_note: >
    The protocol writes this determinant as an imbalance rather than as gross
    load: metered load net of whatever the load already bought in the day-ahead
    market, plus or minus self-schedules and energy trades. It is recorded here
    as gross metered load instead, because the day-ahead purchase is a fixed
    financial position that does not change with real-time behaviour. An extra
    MWh consumed in real time costs the load one times the real-time price no
    matter what it bought the day before.
  measurement_window: >
    The 15-minute Settlement Interval being billed.
  billing_window: >
    The same 15-minute Settlement Interval.
  determinacy: contemporaneous
  pool: null
  rate: '\Phi^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \mathrm{RTSPP}^{\mathrm{EW}}_{z,t}\; x^{k}_{e,z,t} \qquad\qquad \mathrm{RTSPP}^{\mathrm{EW}}_{z,t} \;=\; \max\!\left(\underline{\pi},\;\; \sum_{n \,\in\, \mathcal{N}_{z}}\ \sum_{s \,\in\, \mathcal{T}_{t}} \mathrm{LMP}_{n,s}\,\mathrm{LZWF}_{n,s} \;+\; \mathrm{RTRDP}_{t}\right) \qquad \mathrm{LZWF}_{n,s} \;=\; \frac{\mathrm{SEL}_{n,s}\,\mathrm{TLMP}_{s}}{\sum_{n^{\prime} \in \mathcal{N}_{z}}\sum_{s^{\prime} \in \mathcal{T}_{t}}\mathrm{SEL}_{n^{\prime},s^{\prime}}\,\mathrm{TLMP}_{s^{\prime}}} \qquad \mathrm{RTRDP}_{t} \;=\; \sum_{s \,\in\, \mathcal{T}_{t}}\mathrm{RNWF}_{s}\,\mathrm{RTRDPA}_{s}'
  rate_type: market_clearing
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: The QSE's energy charge for the interval.
    - symbol: '\mathrm{RTSPP}^{\mathrm{EW}}_{z,t}'
      unit: $/MWh
      definition: >
        The energy-weighted zonal settlement price. This, not the plain zonal
        price, is what multiplies metered load - the plain one applies to
        scheduled and day-ahead positions. An average across the whole zone,
        never the price at the QSE's own location.
    - symbol: '\mathrm{LMP}_{n,s}'
      unit: $/MWh
      definition: >
        Locational Marginal Price at node n in dispatch interval s - the cost of
        serving one more MWh at that specific point on the network.
    - symbol: '\mathrm{LZWF}_{n,s}'
      unit: —
      definition: >
        The weight collapsing every node in the zone and every dispatch
        interval into one zonal price. Combines load at each node with the
        duration of each dispatch interval, so the average is both
        load-weighted and time-weighted. Ranges over the whole zone, not over
        the entity's own nodes.
    - symbol: '\mathrm{SEL}_{n,s}'
      unit: MW
      definition: State Estimated Load at node n during dispatch interval s.
    - symbol: '\mathrm{TLMP}_{s}'
      unit: seconds
      definition: >
        Duration of dispatch interval s. Dispatch runs about every five minutes
        inside a fifteen-minute settlement interval, and intervals are not
        equal length, so they are weighted by how long each one lasted.
    - symbol: '\mathrm{RTRDP}_{t}'
      unit: $/MWh
      definition: >
        Reliability Deployment Price for Energy - the settlement-interval
        aggregate, not the adder itself.
    - symbol: '\mathrm{RTRDPA}_{s}'
      unit: $/MWh
      definition: >
        Reliability Deployment Price Adder for dispatch interval s. Compensates
        for the price-suppressing effect of out-of-market reliability actions.
        Administrative, not a clearing outcome.
    - symbol: '\mathrm{RNWF}_{s}'
      unit: —
      definition: >
        The time weight that aggregates per-dispatch-interval adders up to the
        settlement interval - each dispatch interval counts in proportion to
        how long it lasted.
    - symbol: '\underline{\pi}'
      unit: $/MWh
      definition: Administrative price floor, set at -$251/MWh.
  exact_recovery: "n/a"
  true_up: none
  redirect: null
  source:
    - document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
      section: 6.6.1.2, Real-Time Settlement Point Price for a Load Zone, paras (1) and (2)
      effective_date: 2026-08-01
      quote: >
        The Real-Time Settlement Point Price for a Load Zone Settlement Point is
        based on the state-estimated Load in MW and the time-weighted average
        Real-Time LMPs at Electrical Buses that are included in the Load Zone.
      url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
    - document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
      section: 6.6.3.2, Real-Time Energy Imbalance Payment or Charge at a Load Zone, para (2)
      effective_date: 2026-08-01
      quote: >
        RTEIAMT q, p = (-1) * {[RTSPP p * [(SSSK q, p * 1/4) + (DAEP q, p * 1/4)
        + (RTQQEP q, p * 1/4) - (SSSR q, p * 1/4) - (DAES q, p * 1/4) -
        (RTQQES q, p * 1/4)]] + [RTSPPEW p * (RTMGSOGZ q, p - (RTAML q, p -
        RTAMLESRNW q, p))]}
      url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
    - document: ERCOT Nodal Protocols, Section 2 - Definitions and Acronyms
      section: Section 2.1, definition of Adjusted Metered Load (AML)
      effective_date: 2026-08-01
      quote: >
        Adjusted Metered Load (AML) Retail Load usage data that has been
        adjusted for Unaccounted for Energy (UFE), Transmission Losses,
        Distribution Losses, and Direct Current Tie (DC Tie) exports.
      url: https://www.ercot.com/files/docs/2024/06/28/02-080126_Nodal.docx
  notes: >
    The base and the price range over different sets, which is the whole point
    of this record. The base sums only the nodes where the entity actually
    serves load; the price is a load-weighted average across every node in the
    zone, whoever serves load there. A single entity's own location enters that
    average only through its share of zonal load, which is negligible. So the
    cost of an extra MWh to the entity is the zone average price, while the
    cost to the system is the price at the node it withdrew from.
    Those differ whenever there is congestion inside the zone.
    Two administrative terms also sit inside what is nominally a clearing
    price: a floor at -$251/MWh, and the Reliability Deployment Price Adder.
    Neither comes out of the optimisation.
    Since December 2025 this price also carries all scarcity value - see the
    Scarcity Adder record.
    One layer sits hidden inside the base. Turning a meter reading into
    Adjusted Metered Load requires allocating unaccounted-for energy and network
    losses across loads, and each of those is a cost allocation with its own
    rule. Candidate for its own record.

- id: marginal_losses__ercot
  layer: marginal_losses
  market: ercot
  status: absorbed
  payer: qse
  base: null
  base_type: null
  base_note: null
  measurement_window: null
  billing_window: null
  determinacy: contemporaneous
  pool: null
  rate: null
  rate_type: null
  exact_recovery: "n/a"
  true_up: none
  redirect: energy_congestion__ercot
  source:
    document: ERCOT Nodal Protocols, Section 2 - Definitions and Acronyms
    section: Definition of Adjusted Metered Load (AML)
    effective_date: 2026-08-01
    quote: >
      Adjusted Metered Load (AML) Retail Load usage data that has been adjusted
      for Unaccounted for Energy (UFE), Transmission Losses, Distribution
      Losses, and Direct Current Tie (DC Tie) exports.
    url: https://www.ercot.com/files/docs/2024/06/28/02-080126_Nodal.docx
  notes: >
    ERCOT recovers losses by grossing up the quantity rather than by adding a
    price component. Losses are folded into Adjusted Metered Load before any
    charge is calculated, so a load is billed for more MWh than its meter
    recorded and pays the ordinary energy price on the difference. There is no
    separate loss charge and no separate loss determinant.
    That placement has a consequence worth noting: because the adjustment
    enters the base rather than the rate, it scales every layer that uses
    Adjusted Metered Load, not just energy. The loss and unaccounted-for-energy
    allocation rules are therefore doing quiet work across most of this
    inventory, and they have not been extracted.

- id: ruc_capacity_short__ercot
  layer: ruc_capacity_short
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \mathrm{SF}_{e,t}, \qquad \mathrm{SF}_{e,t} \;=\; \max\!\left(0,\;\; \mathrm{Obligation}_{e,t} \;-\; \mathrm{Capacity}_{e,t}\right)'
  base_type: deviation
  base_derived: true
  base_definitions:
    - symbol: '\mathrm{SF}_{e,t}'
      unit: MW
      definition: >
        The QSE's capacity shortfall for the interval - how far the generation
        capacity it brought fell short of what it needed to cover its own load.
        Zero for a QSE that is long.
    - symbol: '\mathrm{Obligation}_{e,t}'
      unit: MW
      definition: >
        The capacity the entity needed to have covered for the interval, as
        determined by the reliability commitment process.
    - symbol: '\mathrm{Capacity}_{e,t}'
      unit: MW
      definition: >
        Capacity the QSE had committed and available. Counted only for
        resources meeting the conditions in 5.7.4.1.1 - self-committed, quick
        start, or released switchable units.
    - symbol: 't'
      unit: —
      definition: A 15-minute Settlement Interval.
  base_note: >
    This is the one base in the inventory that is not a measure of consumption.
    It measures a gap - the distance between what a QSE needed and what it
    brought - so it is a deviation, and it is zero for anyone adequately
    covered. A load that grows without arranging matching capacity increases
    this base directly.
  measurement_window: >
    The 15-minute Settlement Interval being billed.
  billing_window: >
    The same 15-minute Settlement Interval.
  determinacy: contemporaneous
  pool: >
    Make-whole payments to units that ERCOT committed for reliability when the
    market did not commit enough on its own, including amounts for
    reliability-must-run units.
  rate: '\Phi^{k}_{e,t} \;=\; \min\!\left[\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}}\,C^{k}, \;\;\; \frac{2\,C^{k}\,x^{k}_{e,t}}{K_{t}} \;\right] \Big/ 4'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: the QSE's capacity-short charge for the interval.
    - symbol: 'C^{k}'
      unit: $
      definition: >
        Total make-whole payments for the reliability commitment process in the
        hour containing this interval.
    - symbol: 'K_{t}'
      unit: MW
      definition: >
        Total capacity of all resources committed by that reliability process.
        Appears only in the cap.
  rate_derived: true
  exact_recovery: "no"
  true_up: >
    Yes, via a second layer. Whatever the cap prevents this charge from
    collecting is uplifted to all loads on a load ratio share basis under the
    Uplift record.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 5 - Transmission Security Analysis and Reliability Unit Commitment
    section: 5.7.4.1, RUC Capacity-Short Charge, para (1); shortfall share at 5.7.4.1.1
    effective_date: 2026-08-01
    quote: >
      The dollar amount charged to each QSE, due to capacity shortfalls for a
      particular RUC, for a 15-minute Settlement Interval, is the QSE's
      shortfall ratio share multiplied by the total RUC Make-Whole Payments,
      including amounts for RMR Units, to all QSEs for that RUC, subject to a
      cap. The cap on the charge to each QSE is two multiplied by the total RUC
      Make-Whole Payments, including amounts for RMR Units, for all QSEs
      multiplied by that QSE's capacity shortfall for that RUC process divided
      by the total capacity of all RUC-committed Resources during that
      Settlement Interval for the RUC process.
    url: https://www.ercot.com/files/docs/2024/06/28/05-080126_Nodal.docx
  notes: >
    Added as a layer of its own rather than folded into Uplift, because the two
    have genuinely different bases. This tier is charged on a shortfall; the
    residual tier is charged on metered energy. Anything that fails to stick
    here lands there.
    The cap makes recovery inexact by design. It binds precisely when shortfall
    is concentrated in a few payers - the case where a shortfall base would
    otherwise assign a very large charge to whoever was short - and the
    shortfall that the cap declines to collect is then socialised across all
    load.
    This is the closest ERCOT comes to charging a load for the reliability
    consequences of its own growth. Because it targets the gap between load and
    arranged capacity rather than load itself, a flexible load can reduce it
    either by consuming less or by arranging capacity, which is a different
    margin from every other layer here.

- id: scarcity_adder__ercot
  layer: scarcity_adder
  market: ercot
  status: absorbed
  payer: qse
  base: null
  base_type: null
  base_note: null
  measurement_window: null
  billing_window: null
  determinacy: contemporaneous
  pool: null
  rate: null
  rate_type: null
  exact_recovery: "n/a"
  true_up: none
  redirect: energy_congestion__ercot
  source:
    document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
    section: 6.5.7.3, Security Constrained Economic Dispatch, para (1)
    effective_date: 2026-08-01
    quote: >
      The SCED process evaluates Energy Offer Curves, Energy Bid/Offer Curves,
      Ancillary Service Offers, Output Schedules, and RTM Energy Bids to
      determine Resource Dispatch Instructions and Ancillary Service awards by
      maximizing bid-based revenues minus offer-based costs, subject to power
      balance, Ancillary Service Demand Curves (ASDCs), and network constraints.
    url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
  notes: >
    ERCOT no longer has a separable scarcity charge. Until real-time
    co-optimization went live overnight on 4-5 December 2025, scarcity was
    priced by the Operating Reserve Demand Curve as an add-on calculated after
    dispatch and bolted onto the energy price. The dispatch engine now clears
    energy and reserves together against demand curves for each reserve
    product, so scarcity value is inside the energy price rather than added to
    it.
    The change is visible in the settlement formula itself. The September 2025
    zonal price read max(-$251, weighted LMP + RTRSVPOR + RTRDP), where
    RTRSVPOR was the reserve adder term. The current formula reads
    max(-$251, weighted LMP + RTRDP) - the reserve term is deleted. The adder
    acronyms appear 69 times in the September 2025 text of Section 6 and zero
    times in the current one, and they are no longer defined in the definitions
    section at all.
    The Operating Reserve Demand Curve itself survives, but only upstream: an
    aggregate curve is fitted to historical reserve data and split into the
    per-product demand curves the dispatch engine optimises against. It sets
    prices from inside the optimisation instead of adjusting them afterwards.

- id: ancillary_services__ercot
  layer: ancillary_services
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per hour
      definition: >
        The QSE's adjusted metered withdrawal over the operating hour,
        truncated at zero in each of its zones. Numerator of the hourly load
        ratio share that finally determines the charge.
  base_note: >
    An earlier version of this record said the base was lagged. It is not, and
    the correction matters.
    A lagged share does appear, but only at the start. The day before the
    operating day ERCOT tells each QSE its provisional obligation using a
    share taken from the same hour on the most recent settled comparable day.
    That figure drives the initial day-ahead charge. It is then reversed out:
    the day-ahead cost is recalculated on the QSE's actual real-time hourly
    share, and the difference is settled. Anything procured in real time is
    allocated on the contemporaneous fifteen-minute share as well.
    So the historical share determines what a QSE is told to expect and what
    it is billed provisionally, but not what it ends up paying. Final incidence
    falls on consumption during the hour being billed. A load that reduces
    consumption in a costly hour does reduce that hour's charge.
  measurement_window: >
    The Operating Hour being billed, once the day-ahead settlement has been
    recalculated. The provisional obligation notice issued the day before uses
    an earlier comparable day, but that vintage does not survive settlement.
  billing_window: >
    The same Operating Hour.
  determinacy: contemporaneous
  pool: >
    The day-ahead cost of procuring each ancillary service for the hour - what
    ERCOT paid resources for that product plus the associated offer amounts -
    together with the net cost of real-time ancillary service payments and
    charges.
  rate: '\Phi^{k}_{e,t} \;=\; \sum_{a \in \mathcal{A}} \Big[\underbrace{\pi_{a,t}\big(R_{a,t}\,\mathrm{LRS}^{\mathrm{RT}}_{e,t} - \mathrm{SA}_{e,a,t}\big)}_{\text{day-ahead, recalculated}} \;+\; \underbrace{C^{k,\mathrm{RT}}_{a,t}\,\mathrm{LRS}^{\mathrm{RT}}_{e,t}}_{\text{real-time}}\Big] \qquad \pi_{a,t} \;=\; \frac{C^{k,\mathrm{DA}}_{a,t}}{\sum_{e^{\prime} \in \mathcal{E}}\big(R_{a,t}\,\mathrm{LRS}^{\mathrm{RT}}_{e^{\prime},t} - \mathrm{SA}_{e^{\prime},a,t}\big)} \qquad \mathrm{LRS}^{\mathrm{RT}}_{e,t} \;=\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}}'
  rate_type: average_cost
  rate_derived: true
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: >
        The QSE's total ancillary services charge for the hour across all
        products. The protocol writes each component with a leading minus sign,
        its settlement convention for money owed to ERCOT.
    - symbol: '\mathcal{A}'
      unit: —
      definition: >
        The set of five products currently in force - Regulation Up, Regulation
        Down, Responsive Reserve, Non-Spinning Reserve and ERCOT Contingency
        Reserve Service. A sixth, Dispatchable Reliability Reserve Service, is written
        into the protocols but sits behind a pending implementation flag and is
        not yet charged.
    - symbol: '\pi_{a,t}'
      unit: $/MW
      definition: >
        The price charged for product a. Total procurement cost over total
        obligated quantity - an average, not the marginal clearing price. The
        protocol names it separately for each product; this is a generalisation
        across the five provisions, not a symbol that appears in the tariff.
    - symbol: 'R_{a,t}'
      unit: MW
      definition: >
        Quantity of product a ERCOT decided to buy for the hour. Set
        administratively, not by the QSE.
    - symbol: '\mathrm{LRS}^{\mathrm{RT}}_{e,t}'
      unit: —
      definition: >
        Real-time hourly Load Ratio Share. The superscript is the whole point -
        this is the contemporaneous share, and it replaces the historical one
        used for the provisional notice.
    - symbol: '\mathrm{SA}_{e,a,t}'
      unit: MW
      definition: Quantity the QSE arranged for itself rather than buying through ERCOT.
    - symbol: 'C^{k,\mathrm{DA}}_{a,t}'
      unit: $
      definition: ERCOT's total day-ahead procurement cost for product a.
    - symbol: 'C^{k,\mathrm{RT}}_{a,t}'
      unit: $
      definition: >
        Net cost of real-time ancillary service payments and charges for
        product a, allocated separately on the contemporaneous share.
  exact_recovery: "yes"
  true_up: >
    Yes, and it is structural rather than incidental. The day-ahead charge
    computed on the historical share is recalculated on the realised share and
    the difference settled, so the provisional allocation is fully unwound.
  redirect: null
  source:
    - document: ERCOT Nodal Protocols, Section 4 - Day-Ahead Operations
      section: 4.2.1.2, Ancillary Service Obligation Assignment and Notice, para (1)
      effective_date: 2026-08-01
      quote: >
        ERCOT shall base the QSE Ancillary Service allocation on the QSE to LSE
        relationships for the operating date and on the hourly LSE LRSs from the
        Real-Time Market (RTM) data used for Initial Settlement for the same
        hour and day of the week, for the most recent day for which Initial
        Settlement data is available, multiplied by the quantity of that service
        required in the Day-Ahead Ancillary Service Plan.
      url: https://www.ercot.com/files/docs/2024/06/28/04-080126_Nodal.docx
    - document: ERCOT Nodal Protocols, Section 4 - Day-Ahead Operations
      section: 4.6.4.2.1 to 4.6.4.2.5, Charges for Ancillary Services Procurement in the DAM
      effective_date: 2026-08-01
      quote: >
        Each QSE shall pay to ERCOT or be paid by ERCOT a Reg-Up Service charge
        for each hour as follows: DARUAMT q = DARUPR * DARUQ q Where: DARUPR =
        (-1) * DAPCRUAMTTOT / DARUQTOT [...] DARUQ q = DARUO q - DASARUQ q
      url: https://www.ercot.com/files/docs/2024/06/28/04-080126_Nodal.docx
    - document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
      section: 6.7.1, Real-Time Settlement for Updated Day-Ahead Market Ancillary Service Obligations, para (1)
      effective_date: 2026-08-01
      quote: >
        DAM net total costs for Ancillary Service procured in the DAM are
        re-calculated for each QSE under this Section based on Real-Time Load
        Ratio Share (LRS).
      url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
    - document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
      section: 6.7.3, Real-Time Ancillary Service Revenue Neutrality Allocation, para (1)
      effective_date: 2026-08-01
      quote: >
        The total cost for Real-Time Ancillary Service payments and charges is
        allocated to the QSEs representing Load based on Load Ratio Share (LRS).
      url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
  notes: >
    The mechanism runs in four steps: a provisional obligation notice on a
    historical share, a day-ahead charge on that obligation, a recalculation of
    that charge on the realised real-time share, and a separate allocation of
    real-time ancillary service costs on the contemporaneous share. Only the
    first uses lagged data.
    All five live products are allocated identically - the charge provisions are
    the same formula with the acronym swapped, which is why this is one record
    rather than five.
    Procurement is competitive but the charge is not. ERCOT buys reserves in an
    auction with a clearing price, then bills load the average cost of what it
    bought, so load never faces the marginal price of reserves.
    The determinant is measured at the scheduling entity, not the individual
    load. For a load inside a retailer's portfolio, the truncation at zero and
    the share are computed across the whole portfolio.

- id: reactive_supply__ercot
  layer: reactive_supply
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per 15-min interval
      definition: >
        The load's adjusted metered withdrawal for the interval, truncated at
        zero in each of its zones before the zones are summed. This is the
        numerator of the load ratio share.
  base_note: null
  measurement_window: >
    The 15-minute Settlement Interval being billed.
  billing_window: >
    The same 15-minute Settlement Interval.
  determinacy: contemporaneous
  pool: >
    Total payments to resources providing voltage support - both for supplying
    reactive power and for the energy they gave up to do so.
  rate: '\Phi^{k}_{e,t} \;=\; C^{k}_{t}\; \mathrm{LRS}_{e,t} \qquad\qquad \mathrm{LRS}_{e,t} \;=\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}}'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: >
        The load's voltage support charge for the interval. The protocol writes
        this with a leading minus sign, which is its settlement-statement
        convention for money owed to ERCOT.
    - symbol: 'C^{k}_{t}'
      unit: $
      definition: The pool - total voltage support payments for the interval.
  exact_recovery: "yes"
  true_up: >
    None needed. The shares sum to one by construction because the denominator
    is the sum of the same truncated quantities that form each numerator.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
    section: 6.6.7.2, Voltage Support Charge, para (1)
    effective_date: 2026-08-01
    quote: >
      ERCOT shall charge each QSE representing LSEs the total payment for VSS
      as specified in Section 6.6.7.1, Voltage Support Service Payments, based
