      definition: >
        The load's adjusted metered withdrawal over the operating hour,
        truncated at zero in each of its zones. Numerator of the hourly load
        ratio share.
  base_note: null
  measurement_window: >
    The Operating Hour being billed.
  billing_window: >
    The same Operating Hour.
  determinacy: contemporaneous
  pool: >
    The net cost of keeping units running that the market would otherwise have
    retired - standby payments, energy costs and non-performance amounts, less
    what those units earned in the market anyway.
  rate: '\Phi^{k}_{e,t} \;=\; \left(C^{k,\mathrm{sb}}_{t} + C^{k,\mathrm{en}}_{t} - C^{k,\mathrm{adj}}_{t} + \frac{C^{k,\mathrm{np}}_{t}}{\mathrm{HRS}}\right)\mathrm{LRS}_{e,t} \qquad\qquad \mathrm{LRS}_{e,t} \;=\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}}'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: The load's reliability-must-run charge for the hour.
    - symbol: 'C^{k,\mathrm{sb}}_{t}'
      unit: $
      definition: Standby payments to all must-run units for the hour.
    - symbol: 'C^{k,\mathrm{en}}_{t}'
      unit: $
      definition: Energy cost payments to those units for the hour.
    - symbol: 'C^{k,\mathrm{adj}}_{t}'
      unit: $
      definition: >
        What the units earned from the market anyway. Entered with a minus sign,
        so load pays only the incremental cost of the arrangement.
    - symbol: 'C^{k,\mathrm{np}}_{t}'
      unit: $
      definition: Non-performance amounts, spread over H hours.
    - symbol: '\mathrm{HRS}'
      unit: —
      definition: >
        The number of hours the non-performance amount is spread across. A
        count, not a duration, so the division leaves dollars.
  exact_recovery: "yes"
  true_up: none
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
    section: 6.6.6.5, RMR Service Charge, para (1)
    effective_date: 2026-08-01
    quote: >
      The total RMR cost for all RMR Units is allocated to the QSEs
      representing Loads based on LRS. [...] The amount charged to the QSE based
      on its LRS of the difference between the amount paid to all QSEs for RMR
      Service under Section 6.6.6, Reliability Must-Run Settlement, and the
      amount that would have been paid to the QSEs for the same RMR Units if
      they were not providing RMR Service.
    url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
  notes: >
    The pool is netted before allocation - load pays the difference between what
    the unit receives under the arrangement and what it would have earned
    without it, not the gross payment. That is a genuinely cost-causal
    construction of the pool.
    The base is not. Must-run units are retained to solve a specific local
    reliability problem, but the cost is spread across all ERCOT load by
    consumption share, so a load in the constrained area pays the same rate as
    one hundreds of miles away. The locational information that motivated the
    contract is discarded at the allocation step.

- id: iso_admin__ercot
  layer: iso_admin
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per 15-min interval
      definition: >
        The load's adjusted metered withdrawal for the interval, truncated at
        zero separately in each of its zones before the zones are summed.
    - symbol: '\mathcal{Z}_{e}'
      unit: —
      definition: >
        The Load Zones in which this entity serves load. The truncation is
        applied within each of them before they are summed, so a negative
        position in one zone cannot offset a positive one in another.
  base_note: >
    The charge is levied on max(0, load), not on load. A payer whose metered
    load in one of its zones comes out negative in an interval - which happens
    when on-site generation exceeds consumption - pays nothing there rather than
    receiving a credit. The charge stops falling once consumption reaches zero
    and does not turn into a payment beyond it.
  measurement_window: >
    The 15-minute Settlement Interval being billed.
  billing_window: >
    The same 15-minute Settlement Interval.
  determinacy: contemporaneous
  pool: >
    ERCOT's operating budget, as approved by the state regulator. The protocol
    treats the fee as given rather than deriving it from a revenue requirement.
  rate: '\Phi^{k}_{e,t} \;=\; \mathrm{LAFF} \cdot x^{k}_{e,t}'
  rate_type: posted
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: The load's system administration charge for the interval.
    - symbol: '\mathrm{LAFF}'
      unit: $/MWh
      definition: >
        Load Administration Fee Factor - the system administration fee itself.
        A single published number, changed only when the regulator approves a
        new one.
  exact_recovery: "no"
  true_up: >
    None. The fee changes only going forward, on regulatory approval. Nothing
    reconciles what was collected against what ERCOT actually spent.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 9 - Settlement and Billing
    section: 9.16.1, ERCOT System Administration Fee
    effective_date: 2026-08-01
    quote: >
      The Public Utility Commission of Texas (PUCT) has authorized ERCOT to
      charge the ERCOT System Administration fee to fund ERCOT's budget. ERCOT
      converts the fee into a charge to each Qualified Scheduling Entity (QSE)
      using the formula set forth in paragraph (3) below. [...] Each QSE shall
      pay the ERCOT System Administration fee. The ERCOT System Administration
      fee is for each 15-minute Settlement Interval for each QSE.
      ESACAMT q = LAFF * SUM over p of max(0, RTAML q, p) [...]
      LAFF | $/MWh | Load Administration Fee Factor - The ERCOT System
      Administration fee. [...] p | none | A Settlement Point. The summation is
      over all of the Settlement Points.
    url: https://www.ercot.com/files/docs/2023/06/01/09-080126_Nodal.docx
  notes: >
    A near-fixed pool recovered on a usage base, which makes almost the entire
    charge unrelated to what any individual load costs the system. Small money,
    but the cleanest example of the pattern.
    Also a posted rate with no true-up. Collections equal the fee times whatever
    load turns out to be, which has no reason to match ERCOT's budget in any
    year. The error is absorbed by resetting the fee later.
    The charge falls on scheduling entities rather than on loads directly; how
    it is passed through is a contractual matter outside the wholesale rules.

- id: arr_ftr_allocation__ercot
  layer: arr_ftr_allocation
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per month
      definition: >
        The load's adjusted metered withdrawal over the month, truncated at zero
        per settlement point. Numerator of the monthly load ratio share.
  base_note: null
  measurement_window: >
    Measured and credited monthly. Trued up after final settlement for the month.
  billing_window: >
    The same calendar month.
  determinacy: contemporaneous
  pool: >
    Net revenue ERCOT collects from selling congestion revenue rights at
    auction, including the proceeds of rights pre-assigned to municipal and
    cooperative utilities.
  rate: '\Phi^{k}_{e,t} \;=\; -\left(C^{k,\mathrm{zon}}_{z,t}\, \mathrm{LRS}^{z}_{e,t} \;+\; C^{k,\mathrm{sys}}_{t}\, \mathrm{LRS}_{e,t}\right) \qquad\qquad \mathrm{LRS}^{z}_{e,t} \;=\; \frac{x^{k}_{e,z,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},z,t}}'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: >
        The load's share of auction revenue. Negative because this is a credit -
        money flowing to the load rather than from it.
    - symbol: 'C^{k,\mathrm{zon}}_{z,t}'
      unit: $
      definition: >
        Auction revenue from rights that both start and end inside zone z,
        shared only among entities with load in that zone.
    - symbol: 'C^{k,\mathrm{sys}}_{t}'
      unit: $
      definition: >
        Auction revenue from every other right - those whose path crosses a
        zone boundary. Shared across all of ERCOT.
    - symbol: '\mathrm{LRS}^{z}_{e,t}'
      unit: —
      definition: >
        The zonal load ratio share - the entity's fraction of load inside zone z
        alone rather than of ERCOT-wide load. The superscript is what separates
        it from the system-wide share applied to the other pool.
    - symbol: 'x^{k}_{e,z,t}'
      unit: MWh per month
      definition: The entity's truncated metered load inside zone z over the month.
  exact_recovery: "yes"
  true_up: >
    Yes. Distributed monthly on initial settlement data, then trued up after
    final settlement.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 7 - Congestion Revenue Rights
    section: 7.5.7, Method for Distributing CRR Auction Revenues, para (2)
    effective_date: 2025-12-05
    quote: >
      ERCOT shall credit the net CRR Auction revenue (including PCRR revenue)
      produced from CRRs cleared in each CRR Auction that source from a
      Settlement Point located within a 2003 ERCOT CMZ and sink at a Settlement
      Point located within the same 2003 ERCOT CMZ to [QSEs] on a zonal Load
      Ratio Share (LRS) basis. All other net CRR Auction revenues must be
      allocated to QSEs on an ERCOT-wide LRS basis.
    url: https://www.ercot.com/files/docs/2021/08/01/07-120525_Nodal.docx
  notes: >
    A credit, so the sign is reversed, but structurally an ordinary allocation:
    a pool divided by consumption share.
    The zonal split is the only place in this inventory where a pooled layer
    keeps any locational information - revenue from rights that begin and end
    inside one zone stays with that zone's load. The zone boundaries used are
    the congestion zones as they stood in 2003, which no longer correspond to
    how the network is managed.
    Note also that this credit is allocated on consumption while the congestion
    charges it offsets are priced at a zonal average. A load's credit and the
    congestion it actually causes are therefore determined by different things.

- id: loss_congestion_surplus_credit__ercot
  layer: loss_congestion_surplus_credit
  market: ercot
  status: present
  payer: qse
  base: 'x^{k}_{e,t} \;=\; \sum_{z \,\in\, \mathcal{Z}_{e}} \max\!\left(0,\;\; \mathrm{AML}_{e,z,t}\right)'
  base_type: metered_energy
  base_definitions:
    - symbol: 'x^{k}_{e,t}'
      unit: MWh per 15-min interval
      definition: >
        The load's adjusted metered withdrawal for the interval, truncated at
        zero in each of its zones. Numerator of the load ratio share.
  base_note: null
  measurement_window: >
    Measured and settled over the same 15-minute Settlement Interval. No lag.
  billing_window: >
    The same 15-minute Settlement Interval.
  determinacy: contemporaneous
  pool: >
    Whatever the real-time market fails to balance in an interval - the net of
    all energy imbalance payments and charges, DC tie and block load transfer
    payments, self-schedule congestion, and payments to congestion right
    holders. Can be a surplus or a shortfall.
  rate: '\Phi^{k}_{e,t} \;=\; -\,C^{k}_{t}\; \mathrm{LRS}_{e,t} \qquad\qquad \mathrm{LRS}_{e,t} \;=\; \frac{x^{k}_{e,t}}{\sum_{e^{\prime} \in \mathcal{E}} x^{k}_{e^{\prime},t}} \qquad\qquad C^{k}_{t} \;=\; \sum_{v \in \mathcal{V}} \left(\mathrm{PAY}_{v,t} - \mathrm{CHG}_{v,t}\right)'
  rate_type: average_cost
  rate_definitions:
    - symbol: '\Phi^{k}_{e,t}'
      unit: $
      definition: >
        The entity's share of the residual. The leading minus sign means load
        is credited when ERCOT takes in more than it pays out, and charged when
        it pays out more than it takes in.
    - symbol: 'C^{k}_{t}'
      unit: $
      definition: >
        The net imbalance for the interval. Positive when ERCOT paid out more
        than it took in, which is the case that produces a charge to load.
    - symbol: '\mathcal{V}'
      unit: —
      definition: >
        The set of eight real-time money flows enumerated in 6.6.10(1) - the
        three energy imbalance settlements, DC tie imports, block load
        transfers, settlement-only generation, self-schedule congestion, and
        payments to congestion right holders.
    - symbol: '\mathrm{PAY}_{v,t}'
      unit: $
      definition: What ERCOT paid out on flow v during the interval.
    - symbol: '\mathrm{CHG}_{v,t}'
      unit: $
      definition: What ERCOT took in on flow v during the interval.
  rate_derived: true
  exact_recovery: "yes"
  true_up: >
    None needed. This layer is the true-up for the market as a whole - it is
    defined as whatever is left over, so it closes by construction.
  redirect: null
  source:
    document: ERCOT Nodal Protocols, Section 6 - Adjustment Period and Real-Time Operations
    section: 6.6.10, Real-Time Revenue Neutrality Allocation, paras (1) and (2)
    effective_date: 2026-08-01
    quote: >
      ERCOT must be revenue-neutral in each Settlement Interval. Each QSE
      receives an allocated share, on a LRS basis, of the net amount of:
      [Real-Time Energy Imbalance payments or charges at a Resource Node, a
      Load Zone and a Hub; DC Tie import payments; Block Load Transfer Point
      payments; SODG and SOTG energy; Real-Time congestion payments or charges
      for Self-Schedules; and Real-Time payments or charges to the Congestion
      Revenue Right (CRR) Owners].
    url: https://www.ercot.com/files/docs/2024/06/28/06-080126_Nodal.docx
  notes: >
    The market's plug. Prices are set by an optimisation that has no reason to
    make money in equal money out, and this layer sweeps up the difference every
    fifteen minutes and shares it by consumption.
    It is the clearest case in the inventory of a pool with no cost behind it at
    all. The residual is an artefact of how prices were formed - congestion
    rents, the gap between zonal and nodal settlement, payments to rights
    holders - not a resource anyone bought. Yet it is allocated on the same
    determinant as everything else.
    The sign is not fixed. In intervals when the market over-collects, load is
    paid; when it under-collects, load pays. Both directions land on the same
    base, so the layer adds variance to a load's bill that is unrelated to
    anything the load did.
